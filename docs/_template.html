<!doctype html>
<html><head><meta charset="utf-8"><title>{{TITLE}}</title>
<style>
@page { size: Letter; margin: 0.85in 0.8in; }
* { box-sizing: border-box; }
body { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif;
  color: #1c2b33; font-size: 10.5pt; line-height: 1.55; margin: 0; }
.eyebrow { color: #2f7d5f; font-size: 8.5pt; font-weight: 700;
  letter-spacing: .12em; text-transform: uppercase; margin-bottom: 6px; }
h1 { font-size: 26pt; font-weight: 700; margin: 0 0 6px; color: #12222c; letter-spacing: -.4px; }
.subtitle { font-size: 11.5pt; color: #4a5b66; margin: 0 0 6px; }
.byline { font-size: 8.5pt; color: #8a97a0; margin: 0 0 22px; }
.intro { background: #f4f6f6; border-left: 3px solid #2f7d5f;
  padding: 14px 18px; margin: 0 0 26px; font-size: 10.5pt; }
h2 { background: #16232b; color: #fff; font-size: 13pt; font-weight: 700;
  padding: 11px 18px; margin: 30px 0 16px; border-radius: 3px; }
h2 .num { color: #4fbf8b; margin-right: 8px; }
.note { background: #f4f6f6; padding: 13px 17px; margin: 0 0 18px; font-size: 10pt; border-radius: 2px; }
.blocker { background: #fdf1f1; padding: 13px 17px; margin: 0 0 18px;
  font-size: 10pt; color: #9d2f2f; border-radius: 2px; }
ol, ul { padding-left: 22px; margin: 0 0 16px; }
li { margin-bottom: 9px; }
li b { color: #12222c; }
li ul li, li ol li { color: #5d6d77; font-size: 10pt; margin-top: 6px; }
table { width: 100%; border-collapse: collapse; margin: 0 0 18px; font-size: 9.5pt; }
th { background: #16232b; color: #fff; text-align: left; padding: 8px 11px; font-weight: 600; }
td { border-bottom: 1px solid #e3e8ea; padding: 8px 11px; vertical-align: top; }
tr:nth-child(even) td { background: #fafbfb; }
.status-done { color: #2f7d5f; font-weight: 600; }
.status-open { color: #b07d2a; font-weight: 600; }
.status-blocked { color: #9d2f2f; font-weight: 600; }
.footer { margin-top: 34px; padding-top: 12px; border-top: 1px solid #e3e8ea;
  font-size: 8pt; color: #98a4ac; }
h2, .note, .blocker { break-after: avoid; page-break-after: avoid; }
li, tr { break-inside: avoid; page-break-inside: avoid; }
</style></head>
<body>
<div class="eyebrow">{{EYEBROW}}</div>
<h1>{{TITLE}}</h1>
<p class="subtitle">{{SUBTITLE}}</p>
<p class="byline">Prepared for Josh LeClair by John Carlo Caintic · Marketing Strategy &amp; Automation · {{DATE}}</p>
<div class="intro">{{INTRO}}</div>
{{BODY}}
<div class="footer">{{FOOTER}}</div>
</body></html>
